name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  progress:
    name: Progress files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Task files valid, STATUS.md and CODEOWNERS fresh
        run: python scripts/progress.py check
      - name: PR updated the task file of every workstream it touched
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: python scripts/progress.py check-pr --base "${{ github.event.pull_request.base.sha }}" --head "${{ github.event.pull_request.head.sha }}"
      - name: Overdue tasks (warning only)
        run: python scripts/progress.py overdue

  hygiene:
    name: Hygiene (secrets, paths, raw data, links)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python scripts/check_hygiene.py

  lint-test:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check scripts tests
      - run: pytest -q

  spark-tests:
    name: Spark tests (local mode)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            requirements-spark.txt
      - run: pip install -r requirements-dev.txt -r requirements-spark.txt
      - name: Run tests marked "spark" (exit 5 means none collected, which is fine)
        run: |
          set +e
          pytest -q -m spark
          code=$?
          [ "$code" -eq 5 ] && code=0
          exit $code

  streaming-smoke:
    name: Hadoop Streaming smoke tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - run: bash scripts/streaming_smoke.sh

  sql-lint:
    name: Hive SQL lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install sqlfluff==3.2.5
      - run: sqlfluff lint hive analytics --dialect hive

  notebooks:
    name: Notebooks parse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Every .ipynb is valid JSON with cells
        run: |
          python - <<'PY'
          import json, pathlib, sys
          bad = 0
          for p in pathlib.Path("notebooks").rglob("*.ipynb"):
              if ".ipynb_checkpoints" in p.parts:
                  continue
              try:
                  nb = json.loads(p.read_text())
                  assert isinstance(nb.get("cells"), list)
              except Exception as e:
                  print(f"::error::{p}: {e}")
                  bad += 1
          sys.exit(1 if bad else 0)
          PY

  ci-ok:
    name: CI OK
    if: always()
    needs: [progress, hygiene, lint-test, spark-tests, streaming-smoke, sql-lint, notebooks]
    runs-on: ubuntu-latest
    steps:
      - name: All required jobs passed
        run: |
          echo '${{ toJSON(needs) }}' | python3 -c "import json,sys; r={k:v['result'] for k,v in json.load(sys.stdin).items()}; print(r); sys.exit(0 if all(v=='success' for v in r.values()) else 1)"
